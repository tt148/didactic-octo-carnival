name: Daily job collection

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: daily-job-collection
  cancel-in-progress: false

jobs:
  collect:
    name: Collect, score, and persist jobs
    runs-on: ubuntu-latest
    env:
      JOB_TRACKER_PROJECT_DIR: ${{ github.workspace }}
      JOB_TRACKER_DATA_DIR: ${{ github.workspace }}/data
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Restore latest successful collection snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$JOB_TRACKER_DATA_DIR" || {
            echo "::warning::Could not create the job data directory; starting without a restored snapshot."
            exit 0
          }
          rm -f "$JOB_TRACKER_DATA_DIR/jobs.db" "$JOB_TRACKER_DATA_DIR/jobs.csv" || {
            echo "::warning::Could not clear existing job data; starting without a restored snapshot."
            exit 0
          }
          if ! successful_runs="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-collection.yml/runs" \
            --field branch="$GITHUB_REF_NAME" \
            --field status=success \
            --field per_page=100 \
            --jq '.workflow_runs[]?.id')"; then
            echo "::warning::Could not list successful collection runs; starting with an empty database."
            exit 0
          fi
          snapshot_run=""
          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            if ! active_artifacts="$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
                --jq '[.artifacts[]? | select(.name == "job-data" and .expired == false)] | length')"; then
              echo "::warning::Could not list artifacts for run $run_id; starting with an empty database."
              exit 0
            fi
            if [[ "$active_artifacts" -gt 0 ]]; then
              snapshot_run="$run_id"
              break
            fi
          done <<< "$successful_runs"
          if [[ -n "$snapshot_run" ]]; then
            echo "Restoring job data from successful run $snapshot_run."
            if ! gh run download "$snapshot_run" --name job-data --dir "$JOB_TRACKER_DATA_DIR"; then
              if ! rm -f "$JOB_TRACKER_DATA_DIR/jobs.db" "$JOB_TRACKER_DATA_DIR/jobs.csv"; then
                echo "::warning::Could not remove partial snapshot files after download failure."
              fi
              echo "::warning::Could not download the job-data snapshot; starting with an empty database."
            fi
          else
            echo "::warning::No unexpired successful snapshot found; starting with an empty database."
          fi

      - name: Diagnose project paths
        run: python -c "import remote_job_tracker.paths as p; print(p.__file__); print(p.PROJECT_ROOT)"

      - name: Collect and score remote jobs
        run: python collector.py

      - name: Upload updated collection snapshot
        uses: actions/upload-artifact@v4
        with:
          name: job-data
          path: |
            data/jobs.db
            data/jobs.csv
          if-no-files-found: error
          retention-days: 90
