name: Daily job collection

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: daily-job-collection
  cancel-in-progress: false

jobs:
  collect:
    name: Collect, score, and persist jobs
    runs-on: ubuntu-latest
    env:
      JOB_TRACKER_PROJECT_DIR: ${{ github.workspace }}
      JOB_TRACKER_DATA_DIR: ${{ github.workspace }}/data
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Restore latest successful collection snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$JOB_TRACKER_DATA_DIR"
          successful_runs="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-collection.yml/runs" \
            --field branch="$GITHUB_REF_NAME" \
            --field status=success \
            --field per_page=100 \
            --jq '[.[].workflow_runs[] | .id] | .[]')"
          snapshot_run=""
          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            active_artifacts="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
              --jq '[.artifacts[] | select(.name == "job-data" and .expired == false)] | length')"
            if [[ "$active_artifacts" -gt 0 ]]; then
              snapshot_run="$run_id"
              break
            fi
          done <<< "$successful_runs"
          if [[ -n "$snapshot_run" ]]; then
            echo "Restoring job data from successful run $snapshot_run."
            gh run download "$snapshot_run" --name job-data --dir "$JOB_TRACKER_DATA_DIR"
          else
            echo "::warning::No unexpired successful snapshot found; starting a new database."
          fi

      - name: Diagnose project paths
        run: python -c "import remote_job_tracker.paths as p; print(p.__file__); print(p.PROJECT_ROOT)"

      - name: Collect and score remote jobs
        run: python collector.py

      - name: Upload updated collection snapshot
        uses: actions/upload-artifact@v4
        with:
          name: job-data
          path: |
            data/jobs.db
            data/jobs.csv
          if-no-files-found: error
          retention-days: 90
